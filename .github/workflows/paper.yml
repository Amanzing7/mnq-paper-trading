# Save as .github/workflows/paper.yml  (written as JSON, which is valid YAML, so pasting cannot break the spacing)
{
  "name": "MNQ paper trader",
  "on": {
    "schedule": [
      {
        "cron": "7 * * * *"
      }
    ],
    "workflow_dispatch": {
      "inputs": {
        "mode": {
          "description": "live = check today's signals, backtest = compare all filters, check = verify Hyperliquid data against futures",
          "default": "live",
          "type": "choice",
          "options": [
            "live",
            "backtest",
            "check"
          ]
        }
      }
    }
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "paper-trader",
    "cancel-in-progress": false
  },
  "jobs": {
    "run": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "env": {
        "FILTERS": "${{ vars.FILTERS || '0,2' }}",
        "INSTRUMENTS": "${{ vars.INSTRUMENTS || '' }}",
        "MAX_RISK": "${{ vars.MAX_RISK || '150' }}",
        "RISK_USD": "${{ vars.RISK_USD || '20' }}",
        "MAX_NOTIONAL": "${{ vars.MAX_NOTIONAL || '3000' }}",
        "PERP_SESSIONS": "${{ vars.PERP_SESSIONS || '' }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12",
            "cache": "pip"
          }
        },
        {
          "run": "pip install -r requirements.txt"
        },
        {
          "name": "Run",
          "run": "case \"${{ github.event.inputs.mode }}\" in\n  backtest) python run_once.py --backtest ;;\n  check) python run_once.py --check ;;\n  *) python run_once.py ;;\nesac"
        },
        {
          "name": "Save results",
          "run": "git config user.name \"paper-bot\"\ngit config user.email \"paper-bot@users.noreply.github.com\"\nprintf '__pycache__/\\n.venv/\\n' > .gitignore\ngit rm -r -q --cached __pycache__ 2>/dev/null || true\ngit add -A\ngit diff --cached --quiet || (git commit -m \"paper trader update\" && git pull --rebase -q && git push)"
        }
      ]
    }
  }
}
