# Save this file in your GitHub repo at:  .github/workflows/paper.yml
name: MNQ paper trader

on:
  schedule:
    # every 10 minutes, Mon-Fri, 05:00-14:59 UTC  (covers 1:00-9:00am New York in both summer and winter time)
    - cron: "*/10 5-14 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "live = check today's signal, backtest = compare all filters"
        default: "live"
        type: choice
        options: [live, backtest]

permissions:
  contents: write

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FILTER: ${{ vars.FILTER || '0' }}
      QTY: ${{ vars.QTY || '1' }}
      MAX_RISK: ${{ vars.MAX_RISK || '150' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backtest" ]; then python run_once.py --backtest; else python run_once.py; fi
      - name: Save results
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A data RESULTS.md BACKTEST.md 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "paper trader update" && git pull --rebase -q && git push)
